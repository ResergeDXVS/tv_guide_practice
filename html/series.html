<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Passion+One:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-brands/css/uicons-brands.css">
    <link rel="icon" type="image/x-icon" href="/img/TV-WIZARD.ico">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-bold-rounded/css/uicons-bold-rounded.css'>
    <script src="/js/script.js" defer></script>
    <link rel="stylesheet" href="/scss/main.css">
    <title>TV WIZARD: SERIES</title>
</head>
<body>
    <header class="header">
        <div class="header__structure">
            <a href="/index.html" class="header__logo">
                <img src="/img/TV WIZARD.png" alt="TV WIZARD">
                <h1>TV WIZARD</h1>
            </a>
            <div class="header__options">
                <form class="header__search d-flex" role="search">
                    <input id="searchinput" class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
                    <button id="searchbutton" class="btn">Search</button>
                </form>
            </div>
        </div>
    </header>
    <main>
        <section class="series">
            <div class="series__title">
                <h2>Series Search</h2>
            </div>
            <article class="series__recomendations">
                <!-- <div class="card series__item">
                    <img src="..." class="card-img-top">
                    <div class="card-body">
                        <h5 class="card-title">Card title</h5>
                    </div>
                    <div class="series__dates">
                        <p class="series_date"></p>
                    </div>
                    <div class="series__information">
                        <h5 class="series__genre-title">Genres</h5>
                        <div class="series__genres">
                            <span class="badge">Primary</span>
                            <span class="badge">Primary</span>
                        </div>
                    </div>
                </div> -->
            </article>
            <div id="spinner" class="d-flex align-items-center">
                <strong role="status">Loading...</strong>
                <div class="spinner-border ms-auto" aria-hidden="true"></div>
            </div>
            <div id="not_found" class="d-flex align-items-center d-none">
                <strong role="status">Serie Not Found</strong>
            </div>
        </section>
    </main>

    <section class="information">
        <div class="card__cross">
            <i id="cross" class="fi fi-br-x"></i>
        </div>
        <div class="card information__card">
            <div class="row">
                <div class="col-md-4 information__image">
                    <img src="..." class="img-fluid rounded-start" alt="...">
                </div>
                <div class="col-md-8 information__data">
                    
                    <div class="card-body">
                        <h5 id="title" class="card-title">Title</h5>
                        <p id="data" class="card-text">Data</p>
                        <h5 class="card-title">Date: </h5>
                        <p id="date" class="card-text"></p>
                        <h5 id="rating" class="card-title">Rating</h5>
                        <h5 id="network" class="card-title">Network</h5>
                    </div>
                    <!-- <div class="information__genres">
                        <h5 class="information__genre-title">Genres</h5>
                        <div class="information__genres">
                            <span class="badge">Primary</span>
                            <span class="badge">Primary</span>
                        </div>
                    </div> -->
                </div>
            </div>
        </div>
    </section>
    <footer class="footer">
        <section class="footer__data mt-3">
            <p>&copy; 2026 TV WIZARD. All rights reserved.</p>
        </section>
        <section class="footer__social nav">
            <li class="nav-item">
                <a class="nav-link" href="">
                    <i class="fi fi-brands-facebook"></i>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="">
                    <i class="fi fi-brands-instagram"></i>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="">
                    <i class="fi fi-brands-twitter"></i>
                </a>
            </li>
        </section>
        <section class="footer__page my-1">
            <p>Page made by <a href="">Sergio Reza</a></p>
        </section>
    </footer>
    
</body>
</html>
